#  Servicios:
#    Infraestructura  -> postgres, redis (Valkey), s3 (RustFS), create_s3_buckets
#    ML               -> mlflow, fastapi
#    Orquestación     -> airflow-* (apiserver, scheduler, dag-processor,
#                        worker, triggerer, init, cli)
#
#  Uso comun:
#    docker compose --profile all up -d      # levantar todo
#    docker compose --profile all down       # apagar (conserva datos)
#    docker compose down --rmi all --volumes # borrar TODO, incluidos datos
# =============================================================================


# -----------------------------------------------------------------------------
#  Configuración común de Airflow
#  Todos los servicios airflow-* la heredan con:  <<: *airflow-common
# -----------------------------------------------------------------------------
x-airflow-common: &airflow-common
  build: './dockerfiles/airflow'                          # Dockerfile: apache/airflow + nuestras librerías
  image: ${AIRFLOW_IMAGE_NAME:-extending_airflow:latest}  # nombre de la imagen construida
  profiles: [airflow, all]
  networks: [frontend, backend]
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"         # en Linux/Mac: poner tu UID en .env

  environment: &airflow-common-env
    # --- Ejecución de tareas: Celery (cola en Redis, workers separados) ---
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres/${PG_DATABASE:-airflow}
    AIRFLOW__CELERY__WORKER_CONCURRENCY: '2'

    # --- Base de datos de metadata de Airflow ---
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres/${PG_DATABASE:-airflow}

    # --- Comunicación interna (Airflow 3: los workers reportan al apiserver) ---
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'

    # --- Login y claves (valores de ejemplo, solo para uso local) ---
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW_FERNET_KEY:-46BKJvoBr0Ph6r0YS25A_7chFOW_SpyJF3tiWFDBA58=}'
    AIRFLOW__CORE__SECRET_KEY: '${AIRFLOW_SECRET_KEY:-qt2Edq6LIRdv5k0DDznVOA==}'
    AIRFLOW__API__SECRET_KEY: '${AIRFLOW_SECRET_KEY:-qt2Edq6LIRdv5k0DDznVOA==}'
    AIRFLOW__API_AUTH__JWT_SECRET: '${AIRFLOW_API_JWT_SECRET:-qt2Edq6LIRdv5k0DDznVOA==}'

    # --- Comportamiento general ---
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'   # los DAGs nuevos aparecen pausados
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'                # 'true' para ver los DAGs de ejemplo
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'True'

    # --- Variables y conexiones desde airflow/secrets/*.yaml ---
    AIRFLOW__SECRETS__BACKEND: airflow.secrets.local_filesystem.LocalFilesystemBackend
    AIRFLOW__SECRETS__BACKEND_KWARGS: '{"variables_file_path": "/opt/secrets/variables.yaml", "connections_file_path": "/opt/secrets/connections.yaml"}'

    # --- Acceso a MinIO (S3) y MLflow desde los DAGs ---
    AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minio}
    AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minio123}
    AWS_ENDPOINT_URL_S3: http://s3:9000
    MLFLOW_S3_ENDPOINT_URL: http://s3:9000
    MLFLOW_TRACKING_URI: http://mlflow:5000

    # --- Para que las tareas que corren en /opt/ml-venv encuentren airflow/dags/utils ---
    PYTHONPATH: /opt/airflow/dags

  volumes:   # carpetas del repo montadas en vivo dentro de los contenedores
    - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-./airflow}/secrets:/opt/secrets

  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy


services:

  # ===========================================================================
  #  INFRAESTRUCTURA
  # ===========================================================================

  # Base de datos relacional: metadata de Airflow (db "airflow") y MLflow (db "mlflow_db")
  postgres:
    build: './dockerfiles/postgres'
    image: postgres_system
    container_name: postgres
    profiles: [airflow, mlflow, all]
    restart: always
    networks: [backend]
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${PG_DATABASE:-airflow}
      - POSTGRES_USER=${PG_USER:-airflow}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-airflow}
      - POSTGRES_DATABASE=${PG_DATABASE:-airflow}
      - POSTGRES_PORT=${PG_PORT:-5432}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "5432", "-U", "${PG_USER:-airflow}"]
      interval: 60s
      timeout: 20s
      retries: 3

  # Cola de mensajes de Celery (Valkey = fork open source de Redis). Solo red interna.
  redis:
    image: valkey/valkey:8.1-bookworm
    restart: always
    networks: [backend]
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

  # Data Lake compatible con S3. API en :9000, consola web en :9001
  # Usa RustFS (reemplazo de MinIO): MinIO retiró sus imágenes públicas en 2026.
  # El servicio se sigue llamando "s3", así que el resto del sistema no cambia.
  s3:
    image: rustfs/rustfs:latest
    container_name: rustfs
    profiles: [airflow, mlflow, all]
    restart: always
    networks: [frontend, backend]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_PORT_UI:-9001}:9001"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${MINIO_ACCESS_KEY:-minio}
      - RUSTFS_SECRET_KEY=${MINIO_SECRET_ACCESS_KEY:-minio123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Tarea de inicialización: crea los buckets s3://mlflow y s3://data y termina.
  # Usa la AWS CLI oficial (cualquier cliente S3 sirve).
  create_s3_buckets:
    image: amazon/aws-cli:latest
    container_name: create_s3_buckets
    profiles: [airflow, mlflow, all]
    networks: [backend]
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minio}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-minio123}
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
      aws --endpoint-url http://s3:9000 s3 mb s3://${MLFLOW_BUCKET_NAME:-mlflow} || true;
      aws --endpoint-url http://s3:9000 s3 mb s3://${DATA_REPO_BUCKET_NAME:-data} || true;
      exit 0;
      '

  # ===========================================================================
  #  MACHINE LEARNING
  # ===========================================================================

  # Tracking de experimentos y Model Registry.
  # Metadata -> Postgres (mlflow_db) | Artefactos (modelos) -> MinIO (s3://mlflow)
  mlflow:
    build: './dockerfiles/mlflow'
    image: mlflow
    container_name: mlflow
    profiles: [mlflow, all]
    restart: always
    networks: [frontend, backend]
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minio}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-minio123}
      - MLFLOW_S3_ENDPOINT_URL=http://s3:9000
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres:5432/mlflow_db
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME:-mlflow}/
      --host 0.0.0.0
      --workers 1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://mlflow:5000 || exit 1
      interval: 60s
      timeout: 10s
      retries: 3

  # API REST que sirve el modelo. Documentación en http://localhost:8800/docs
  fastapi:
    build: './dockerfiles/fastapi'
    image: backend_fastapi
    container_name: fastapi
    profiles: [all]
    restart: always
    networks: [frontend, backend]
    ports:
      - "${FASTAPI_PORT:-8800}:8800"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minio}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-minio123}
      - AWS_ENDPOINT_URL_S3=http://s3:9000
      - MLFLOW_S3_ENDPOINT_URL=http://s3:9000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_NAME=revenue_regressor
      - MODEL_ALIAS=champion
      - MODEL_CHECK_SECONDS=30   # cada cuánto busca un champion nuevo
    command: uvicorn app:app --host 0.0.0.0 --port 8800
    depends_on:   # solo necesita MLflow; los modelos los registra Airflow, pero no depende de él
      mlflow:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:8800/health || exit 1
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

  # ===========================================================================
  #  ORQUESTACIÓN (Apache Airflow 3)
  # ===========================================================================

  # Interfaz web y API de Airflow -> http://localhost:8080 (usuario/clave: airflow)
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server --workers 1
    restart: always
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Decide qué tareas corren y cuándo; las manda a la cola de Celery
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Lee y parsea los archivos de airflow/dags
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Ejecuta las tareas de los DAGs (acá corre nuestro código Python)
  airflow-worker:
    <<: *airflow-common
    command: celery worker -c 2
    restart: always
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"   # apagado ordenado de los workers de Celery
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Maneja tareas diferidas (sensores asíncronos)
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Inicialización (corre una vez y termina): migra la base, crea el usuario
  # admin, revisa recursos y arregla permisos de las carpetas montadas.
  # Script tomado del compose oficial de Apache Airflow.
  airflow-init:
    <<: *airflow-common
    user: "0:0"   # necesita root para cambiar permisos
    entrypoint: /bin/bash
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID:-50000}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:${AIRFLOW_GID:-0}"
        echo
        chown -R "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:${AIRFLOW_GID:-0}"
        echo
        chown -v -R "${AIRFLOW_UID}:${AIRFLOW_GID:-0}" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    # yamllint enable rule:line-length

  # CLI de Airflow para depurar. Solo con:  docker compose --profile all --profile debug up
  airflow-cli:
    <<: *airflow-common
    container_name: airflow_cli
    profiles: [debug]
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow


# -----------------------------------------------------------------------------
#  Redes: backend = infraestructura interna | frontend = servicios de cara al usuario
# -----------------------------------------------------------------------------
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

# -----------------------------------------------------------------------------
#  Volúmenes persistentes (se borran solo con: docker compose down --volumes)
# -----------------------------------------------------------------------------
volumes:
  db_data:
  minio_data:
